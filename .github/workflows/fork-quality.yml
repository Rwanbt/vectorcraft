# Fork-only quality gate: do not merge a draft PR until all required checks pass.
# Keep this separate from release packaging and optional corpus workflows.
name: Fork quality and coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  workspace-linux:
    name: Linux - complete workspace quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev libudev-dev \
            libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Rust 1.95 with lint and wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: vectorcraft-fork-quality
      - name: Reject inconsistent lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Canonical project checks (fmt, clippy, tests, assets, brands, layers, wasm)
        run: cargo xtask ci
      - name: Collect actual harness test counts
        run: |
          cargo xtask stats --exact | tee test-counts.txt
          if grep -Eq '[[:space:]]error[[:space:]]*
  geometry-coverage:
    name: Linux - instrumented geometry baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Rust 1.95 with LLVM tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: vectorcraft-geom-cov
      - name: Measure unit and integration coverage with real tests
        run: |
          mkdir -p coverage
          cargo llvm-cov -p vectorcraft-geom --locked --lcov --output-path coverage/geom.lcov
          cargo llvm-cov report --json --output-path coverage/geom.json
          cargo llvm-cov report --summary-only
      - name: Publish machine-readable baseline (no inferred percentages)
        uses: actions/upload-artifact@v7
        with:
          name: vectorcraft-geometry-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 30

  geometry-portability:
    name: Geometry regression - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          key: vectorcraft-geom-${{ matrix.os }}
      - name: Portable deterministic geometry tests
        run: cargo test -p vectorcraft-geom --locked
 test-counts.txt; then
            echo "::error::At least one crate's test harness could not be enumerated"
            exit 1
          fi
      - name: Archive exact test counts
        uses: actions/upload-artifact@v7
        with:
          name: vectorcraft-exact-test-counts
          path: test-counts.txt
          if-no-files-found: error
          retention-days: 30

  geometry-coverage:
    name: Linux - instrumented geometry baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Rust 1.95 with LLVM tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: vectorcraft-geom-cov
      - name: Measure unit and integration coverage with real tests
        run: |
          mkdir -p coverage
          cargo llvm-cov -p vectorcraft-geom --locked --lcov --output-path coverage/geom.lcov
          cargo llvm-cov report --json --output-path coverage/geom.json
          cargo llvm-cov report --summary-only
      - name: Publish machine-readable baseline (no inferred percentages)
        uses: actions/upload-artifact@v7
        with:
          name: vectorcraft-geometry-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 30

  geometry-portability:
    name: Geometry regression - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          key: vectorcraft-geom-${{ matrix.os }}
      - name: Portable deterministic geometry tests
        run: cargo test -p vectorcraft-geom --locked
